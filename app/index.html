<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <!-- Same reasoning as frontend/landing/index.html's color-scheme tag --
         without this, a browser/OS "force dark" setting can re-invert our
         own colors on top of our own light/dark theme (ThemeContext.jsx),
         producing off colors in both modes. -->
    <meta name="color-scheme" content="light dark" />
    <title>IPS - Internet Program System</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/app/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/app/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/app/apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="/app/favicon.png" />
    <!-- PWA "Add to Home Screen" -- iOS has no App Store build (see
         tauri-plugin-apk-installer's own notes on why there's no iOS
         equivalent to Android's self-updating APK install), so this is
         the actual iOS install path: open this URL in Safari, Share ->
         Add to Home Screen. manifest.json covers Android/Chrome's own
         install prompt too, for free, as a side effect. -->
    <link rel="manifest" href="/app/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IPS" />
